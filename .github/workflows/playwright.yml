name: Playwright Tests + Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Java (for Allure CLI)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: pw
        run: npx playwright test
        continue-on-error: true

      - name: Debug Allure results
        if: ${{ !cancelled() }}
        run: |
          echo "--- installed allure packages ---"
          npm ls allure-playwright allure-commandline || true
          echo "--- allure-results ---"
          ls -la allure-results || echo "allure-results folder does not exist"
          echo "--- test-results ---"
          ls -la test-results || true

      - name: Check Allure results exist
        if: ${{ !cancelled() }}
        run: |
          if [ ! -d allure-results ] || [ -z "$(ls -A allure-results)" ]; then
            echo "::error::allure-results is empty. Make sure allure-playwright is in package.json and in the reporter in playwright.config.ts, and that the tests actually ran."
            exit 1
          fi

      - name: Generate Allure Report
        if: ${{ !cancelled() }}
        run: |
          npx allure generate allure-results --clean -o allure-report
          cp allure-report/index.html allure-report/404.html

      - name: Upload Allure results (raw)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload failure screenshots, videos and traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-screenshots
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && hashFiles('allure-report/index.html') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Fail job if Playwright tests failed
        if: ${{ steps.pw.outcome == 'failure' }}
        run: |
          echo "Playwright tests failed. See the Allure report for details."
          exit 1

  deploy:
    needs: test
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4